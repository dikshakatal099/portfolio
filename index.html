<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Diksha Katal is an Indian futsal goalkeeper, Technical Manager and the first Indian player in the Thailand Women's Futsal League." />
    <meta name="keywords" content="Diksha Katal, futsal goalkeeper India, Thailand Women's Futsal League, Kasem Bundit FC, Indian footballer" />
    <meta property="og:title" content="Diksha Katal — Goalkeeper. Pathbreaker." />
    <meta property="og:description" content="The first Indian player in the Thailand Women's Futsal League." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Diksha Katal — Goalkeeper. Pathbreaker.</title>
    <style>
      .portrait-duo { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:#111c30; }
      .portrait-duo img { object-fit:cover; object-position:center 28%; }
      .connect { display:grid; grid-template-columns:.8fr 1.2fr; gap:8vw; align-items:start; }
      .connect-intro p { font-size:16px; line-height:1.55; max-width:320px; }
      .contact-hub { border-top:1px solid #bcb8af; }
      .email-card { display:flex; flex-direction:column; gap:15px; background:#111c30; color:#fff; padding:32px; text-decoration:none; }
      .email-card small,.social-grid small,.location-card small { font:10px 'DM Mono',monospace; letter-spacing:.09em; color:#d3b35c; }
      .email-card b { font:600 clamp(27px,3.4vw,47px) Oswald,Impact,sans-serif; letter-spacing:-.02em; }
      .email-card>span { font:10px 'DM Mono',monospace; text-transform:uppercase; color:#d3b35c; }
      .social-grid { display:grid; grid-template-columns:1fr 1fr; }
      .social-grid>a,.location-card { min-height:140px; padding:23px; border-right:1px solid #bcb8af; border-bottom:1px solid #bcb8af; text-decoration:none; display:flex; flex-direction:column; gap:10px; }
      .social-grid>a:nth-child(2),.location-card { border-right:0; }
      .social-grid b,.location-card b { font:600 24px Oswald,Impact,sans-serif; letter-spacing:-.01em; }
      .social-grid .arrow { margin-top:auto; color:#9d843e; }
      @media(max-width:800px) { .connect { display:block; } .contact-hub { margin-top:45px; } .portrait-duo img { object-position:center 22%; } }
      @media(max-width:480px) { .social-grid { grid-template-columns:1fr; } .social-grid>a,.location-card { min-height:112px; border-right:0; } .email-card { padding:25px; } .email-card b { font-size:27px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
